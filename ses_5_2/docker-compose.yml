services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carta
      POSTGRES_PASSWORD: carta
      POSTGRES_DB: carta
    ports:
      - "5432:5432"
    volumes:
      - carta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carta"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://carta:carta@postgres:5432/carta
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    volumes:
      - carta_documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://carta:carta@postgres:5432/carta
      REDIS_URL: redis://redis:6379/0
    volumes:
      - carta_documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  carta_postgres_data:
  carta_documents:
