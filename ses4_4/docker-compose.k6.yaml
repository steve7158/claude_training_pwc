services:
  influxdb:
    image: influxdb:1.8
    container_name: k6-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - k6-influxdb-data:/var/lib/influxdb
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: k6-grafana
    ports:
      # Host port 3001: 3000 is already used by this project's OTel/Prometheus/Tempo
      # Grafana stack (see docker-compose.yaml).
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./k6-observability/grafana/provisioning:/etc/grafana/provisioning
      - ./k6-observability/grafana/dashboards:/var/lib/grafana/dashboards
      - k6-grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  k6-influxdb-data:
  k6-grafana-data:
